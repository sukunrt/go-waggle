syntax="proto3";

option go_package="github.com/sukunrt/go-waggle/pb";

message TopicSubscription {
  optional bytes topicID = 1;
  // 0 or absent is the control stream. 1 is the data stream.
  optional uint32 stream = 2;
}

message ObjectPieces {
  optional bytes objectID = 2;
  optional bytes piecesMetadata = 3;
  optional bytes pieces = 4;
}
